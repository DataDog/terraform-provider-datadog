openapi: 3.0.0
info:
  title: normalized oneOf fixture
  version: 1.0.0
paths:
  /inline:
    post:
      operationId: CreateInlineOneOf
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: inline_oneof
        group:
          create: CreateInlineOneOf
          read: CreateInlineOneOf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: string
                - type: boolean
                - nullable: true
      responses:
        "204":
          description: no content
  /inline-reordered:
    post:
      operationId: CreateReorderedInlineOneOf
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: reordered_inline_oneof
        group:
          create: CreateReorderedInlineOneOf
          read: CreateReorderedInlineOneOf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - nullable: true
                - type: boolean
                - type: string
      responses:
        "204":
          description: no content
  /animals:
    post:
      operationId: CreateAnimal
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: animal
        group:
          create: CreateAnimal
          read: CreateAnimal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnimalUnion"
      responses:
        "200":
          description: animal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimalUnion"
  /nested:
    post:
      operationId: CreateNestedOneOf
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: nested_oneof
        group:
          create: CreateNestedOneOf
          read: CreateNestedOneOf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice, choices]
              properties:
                choice:
                  oneOf:
                    - type: string
                    - type: boolean
                optional_choice:
                  oneOf:
                    - type: integer
                    - type: string
                choices:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: integer
                choice_map:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                recursive:
                  oneOf:
                    - type: string
                    - $ref: "#/components/schemas/RecursiveVariant"
      responses:
        "204":
          description: no content
  /siblings:
    post:
      operationId: CreateOneOfWithSiblings
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: oneof_with_siblings
        group:
          create: CreateOneOfWithSiblings
          read: CreateOneOfWithSiblings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              properties:
                shared:
                  type: string
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                - $ref: "#/components/schemas/BetaVariant"
      responses:
        "204":
          description: no content
  /object-type-sibling:
    post:
      operationId: CreateOneOfWithObjectTypeSibling
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: oneof_with_object_type_sibling
        group:
          create: CreateOneOfWithObjectTypeSibling
          read: CreateOneOfWithObjectTypeSibling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                - $ref: "#/components/schemas/BetaVariant"
      responses:
        "204":
          description: no content
  /required-only-sibling:
    post:
      operationId: CreateOneOfWithRequiredOnlySibling
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: oneof_with_required_only_sibling
        group:
          create: CreateOneOfWithRequiredOnlySibling
          read: CreateOneOfWithRequiredOnlySibling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                - $ref: "#/components/schemas/BetaVariant"
      responses:
        "204":
          description: no content
  /allof-sibling:
    post:
      operationId: CreateOneOfWithAllOfSibling
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: oneof_with_allof_sibling
        group:
          create: CreateOneOfWithAllOfSibling
          read: CreateOneOfWithAllOfSibling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                - $ref: "#/components/schemas/BetaVariant"
              allOf:
                - type: object
                  required: [shared]
                  properties:
                    shared:
                      type: string
      responses:
        "204":
          description: no content
  /independent-unions:
    post:
      operationId: CreateIndependentUnions
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: independent_unions
        group:
          create: CreateIndependentUnions
          read: CreateIndependentUnions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                - $ref: "#/components/schemas/BetaVariant"
              allOf:
                - oneOf:
                    - type: string
                    - type: boolean
      responses:
        "204":
          description: no content
  /ref-sibling-alternative:
    post:
      operationId: CreateOneOfRefSiblingAlternative
      tags: [OneOf]
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: oneof_ref_sibling_alternative
        group:
          create: CreateOneOfRefSiblingAlternative
          read: CreateOneOfRefSiblingAlternative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AlphaVariant"
                  description: Local alpha description.
                - $ref: "#/components/schemas/BetaVariant"
      responses:
        "204":
          description: no content
components:
  schemas:
    RecursiveVariant:
      type: object
      properties:
        nested:
          oneOf:
            - type: boolean
            - type: string
    AlphaVariant:
      type: object
      required: [alpha]
      properties:
        kind:
          type: string
        alpha:
          type: boolean
    BetaVariant:
      type: object
      required: [beta]
      properties:
        kind:
          type: string
        beta:
          type: integer
    AnimalUnion:
      discriminator:
        propertyName: kind
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
      oneOf:
        - $ref: "#/components/schemas/Dog"
        - $ref: "#/components/schemas/Cat"
    Cat:
      type: object
      required: [kind, lives]
      properties:
        kind:
          type: string
        lives:
          type: integer
    Dog:
      type: object
      required: [kind, bark]
      properties:
        kind:
          type: string
        bark:
          type: boolean
