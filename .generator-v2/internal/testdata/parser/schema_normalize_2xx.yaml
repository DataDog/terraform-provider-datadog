openapi: 3.0.0
info:
  title: normalize 2xx response selection fixture
  version: 1.0.0
paths:
  /skip-bodiless:
    post:
      operationId: CreateSkipBodiless
      responses:
        '201':
          description: created (no JSON body)
        '202':
          description: accepted with JSON body
          content:
            application/json:
              schema:
                type: string
  /prefer-first:
    post:
      operationId: CreatePreferFirst
      responses:
        '202':
          description: accepted — first declared code wins
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '201':
          description: created — lower code declared later loses
          content:
            application/json:
              schema:
                type: integer
  /only-204:
    post:
      operationId: CreateOnly204
      responses:
        '204':
          description: no content
  /plain-text-before-json:
    delete:
      operationId: DeletePreferFirstText
      responses:
        '200':
          description: Plain text response
          content:
            text/plain:
              schema:
                type: string
        '201':
          description: JSON response
          content:
            application/json:
              schema:
                type: integer
  /multiple-media:
    delete:
      operationId: DeletePreferFirstMedia
      responses:
        '200':
          description: Multiple formats
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: integer
  /empty-media:
    delete:
      operationId: DeleteSkipEmptyMedia
      responses:
        '200':
          description: Skip media without schemas
          content:
            application/json: {}
            text/plain: {}
            application/vnd.api+json:
              schema:
                type: boolean
  /error-body-only:
    delete:
      operationId: DeleteErrorBodyOnly
      responses:
        default:
          description: Default body does not determine the Go return type
          content:
            application/json:
              schema:
                type: integer
        '302':
          description: Redirect body does not determine the Go return type
          content:
            application/json:
              schema:
                type: boolean
        '204':
          description: No content
        '400':
          description: Error body is not a success body
          content:
            application/json:
              schema:
                type: string
tags:
- name: Terraform
  x-datadog-tf-generator:
    skip_bodiless:
      resource:
        artifact_name: skip_bodiless
        group:
          create: CreateSkipBodiless
          read: CreateSkipBodiless
          delete: CreateSkipBodiless
    prefer_first:
      resource:
        artifact_name: prefer_first
        group:
          create: CreatePreferFirst
          read: CreatePreferFirst
          delete: CreatePreferFirst
    only_204:
      resource:
        artifact_name: only_204
        group:
          create: CreateOnly204
          read: CreateOnly204
          delete: CreateOnly204
    delete_preferfirsttext:
      resource:
        group:
          create: DeletePreferFirstText
          read: DeletePreferFirstText
          delete: DeletePreferFirstText
    delete_preferfirstmedia:
      resource:
        group:
          create: DeletePreferFirstMedia
          read: DeletePreferFirstMedia
          delete: DeletePreferFirstMedia
    delete_skipemptymedia:
      resource:
        group:
          create: DeleteSkipEmptyMedia
          read: DeleteSkipEmptyMedia
          delete: DeleteSkipEmptyMedia
    delete_errorbodyonly:
      resource:
        group:
          create: DeleteErrorBodyOnly
          read: DeleteErrorBodyOnly
          delete: DeleteErrorBodyOnly
