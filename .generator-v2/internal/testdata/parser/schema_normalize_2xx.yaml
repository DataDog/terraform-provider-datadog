openapi: 3.0.0
info:
  title: normalize 2xx response selection fixture
  version: 1.0.0
paths:
  /skip-bodiless:
    post:
      operationId: CreateSkipBodiless
      responses:
        '201':
          description: created (no JSON body)
        '202':
          description: accepted with JSON body
          content:
            application/json:
              schema:
                type: string
  /prefer-lower:
    post:
      operationId: CreatePreferLower
      responses:
        '200':
          description: ok — lower code wins
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '201':
          description: created — higher code loses
          content:
            application/json:
              schema:
                type: integer
  /only-204:
    post:
      operationId: CreateOnly204
      responses:
        '204':
          description: no content
  /plain-text-before-json:
    delete:
      operationId: DeletePreferLowerText
      responses:
        '200':
          description: Plain text response
          content:
            text/plain:
              schema:
                type: string
        '201':
          description: JSON response
          content:
            application/json:
              schema:
                type: integer
  /multiple-media:
    delete:
      operationId: DeletePreferJSON
      responses:
        '200':
          description: Multiple formats
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: integer
  /empty-media:
    delete:
      operationId: DeleteSkipEmptyMedia
      responses:
        '200':
          description: Skip media without schemas
          content:
            application/json: {}
            text/plain: {}
            application/vnd.api+json:
              schema:
                type: boolean
  /error-body-only:
    delete:
      operationId: DeleteErrorBodyOnly
      responses:
        '204':
          description: No content
        '400':
          description: Error body is not a success body
          content:
            application/json:
              schema:
                type: string
tags:
- name: Terraform
  x-datadog-tf-generator:
    skip_bodiless:
      resource:
        artifact_name: skip_bodiless
        group:
          create: CreateSkipBodiless
          read: CreateSkipBodiless
          delete: CreateSkipBodiless
    prefer_lower:
      resource:
        artifact_name: prefer_lower
        group:
          create: CreatePreferLower
          read: CreatePreferLower
          delete: CreatePreferLower
    only_204:
      resource:
        artifact_name: only_204
        group:
          create: CreateOnly204
          read: CreateOnly204
          delete: CreateOnly204
    delete_preferlowertext:
      resource:
        group:
          create: DeletePreferLowerText
          read: DeletePreferLowerText
          delete: DeletePreferLowerText
    delete_preferjson:
      resource:
        group:
          create: DeletePreferJSON
          read: DeletePreferJSON
          delete: DeletePreferJSON
    delete_skipemptymedia:
      resource:
        group:
          create: DeleteSkipEmptyMedia
          read: DeleteSkipEmptyMedia
          delete: DeleteSkipEmptyMedia
    delete_errorbodyonly:
      resource:
        group:
          create: DeleteErrorBodyOnly
          read: DeleteErrorBodyOnly
          delete: DeleteErrorBodyOnly
