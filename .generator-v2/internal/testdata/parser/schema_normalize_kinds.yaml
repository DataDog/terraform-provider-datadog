openapi: 3.0.0
info:
  title: normalize schema kinds fixture
  version: 1.0.0
paths:
  /primitives:
    post:
      operationId: CreatePrimitive
      requestBody:
        content:
          application/json:
            schema:
              type: string
              format: date-time
              description: The creation timestamp of the resource.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: integer
                format: int64
  /objects:
    post:
      operationId: CreateObject
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                count:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /objects-multi-required:
    post:
      operationId: CreateObjectMultiRequired
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - z_prop
                - a_prop
                - m_prop
              properties:
                z_prop:
                  type: string
                a_prop:
                  type: integer
                m_prop:
                  type: boolean
      responses:
        '204':
          description: no content
  /arrays:
    post:
      operationId: CreateArray
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '204':
          description: no content
  /maps:
    post:
      operationId: CreateMap
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
      responses:
        '204':
          description: no content
  /variants-oneof:
    post:
      operationId: CreateVariantOneOf
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: string
                - type: integer
      responses:
        '204':
          description: no content
  /variants-anyof:
    post:
      operationId: CreateVariantAnyOf
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - type: string
                - type: integer
      responses:
        '204':
          description: no content
  /enums:
    post:
      operationId: CreateEnum
      requestBody:
        content:
          application/json:
            schema:
              type: string
              enum:
                - active
                - inactive
                - pending
      responses:
        '204':
          description: no content
  /sensitives:
    post:
      operationId: CreateSensitive
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-datadog-tf-generator:
                sensitive: true
              properties:
                x_secret:
                  type: string
                  x-secret: true
                write_only:
                  type: string
                  writeOnly: true
                tracking_sensitive:
                  type: string
                  x-datadog-tf-generator:
                    sensitive: true
                x_secret_false:
                  type: string
                  x-secret: false
                x_secret_malformed:
                  type: string
                  x-secret: not-a-boolean
                write_only_false:
                  type: string
                  writeOnly: false
                explicit_false:
                  type: string
                  writeOnly: true
                  x-secret: true
                  x-datadog-tf-generator:
                    sensitive: false
                x_secret_explicit_false:
                  type: string
                  x-secret: true
                  x-datadog-tf-generator:
                    sensitive: false
                plain:
                  type: string
      responses:
        '204':
          description: no content
  /get-no-body:
    get:
      operationId: GetNoBody
      responses:
        '204':
          description: no content
  /untracked:
    get:
      operationId: GetUntracked
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
tags:
- name: Terraform
  x-datadog-tf-generator:
    primitive_r:
      resource:
        artifact_name: primitive_r
        group:
          create: CreatePrimitive
          read: CreatePrimitive
          delete: CreatePrimitive
    object_r:
      resource:
        artifact_name: object_r
        group:
          create: CreateObject
          read: CreateObject
          delete: CreateObject
    object_multi_required_r:
      resource:
        artifact_name: object_multi_required_r
        group:
          create: CreateObjectMultiRequired
          read: CreateObjectMultiRequired
          delete: CreateObjectMultiRequired
    array_r:
      resource:
        artifact_name: array_r
        group:
          create: CreateArray
          read: CreateArray
          delete: CreateArray
    map_r:
      resource:
        artifact_name: map_r
        group:
          create: CreateMap
          read: CreateMap
          delete: CreateMap
    variant_oneof_r:
      resource:
        artifact_name: variant_oneof_r
        group:
          create: CreateVariantOneOf
          read: CreateVariantOneOf
          delete: CreateVariantOneOf
    variant_anyof_r:
      resource:
        artifact_name: variant_anyof_r
        group:
          create: CreateVariantAnyOf
          read: CreateVariantAnyOf
          delete: CreateVariantAnyOf
    enum_r:
      resource:
        artifact_name: enum_r
        group:
          create: CreateEnum
          read: CreateEnum
          delete: CreateEnum
    sensitive_r:
      resource:
        artifact_name: sensitive_r
        group:
          create: CreateSensitive
          read: CreateSensitive
          delete: CreateSensitive
    no_body_ds:
      datasource_singular:
        artifact_name: no_body_ds
        group:
          read: GetNoBody
