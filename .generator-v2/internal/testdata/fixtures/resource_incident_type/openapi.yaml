openapi: 3.0.0
info:
  contact:
    email: support@datadoghq.com
    name: Datadog Support
    url: https://www.datadoghq.com/support/
  description: Collection of all Datadog Public endpoints.
  title: Datadog API V2 Collection
  version: '1.0'
servers:
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: The regional site for Datadog customers.
      enum:
      - datadoghq.com
      - us3.datadoghq.com
      - us5.datadoghq.com
      - ap1.datadoghq.com
      - ap2.datadoghq.com
      - uk1.datadoghq.com
      - datadoghq.eu
      - ddog-gov.com
      - us2.ddog-gov.com
      - uk1.datadoghq.com
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
- url: '{protocol}://{name}'
  variables:
    name:
      default: api.datadoghq.com
      description: Full site DNS name.
    protocol:
      default: https
      description: The protocol for accessing the API.
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: Any Datadog deployment.
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
security:
- apiKeyAuth: []
  appKeyAuth: []
tags:
- description: Manage incident response, as well as associated attachments, metadata, and todos. See the
    [Incident Management page](https://docs.datadoghq.com/service_management/incident_management/) for
    more information.
  name: Incidents
paths:
  /api/v2/incidents/config/types:
    post:
      description: Create an incident type.
      operationId: CreateIncidentType
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      createdBy: 00000000-0000-0000-0000-000000000000
                      description: Any incidents that harm (or have the potential to) the confidentiality,
                        integrity, or availability of our data.
                      is_default: false
                      lastModifiedBy: 00000000-0000-0000-0000-000000000000
                      name: Security Incident
                      prefix: IR
                    type: incident_types
            schema:
              $ref: '#/components/schemas/IncidentTypeCreateRequest'
        description: Incident type payload.
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        description: Any incidents that harm the confidentiality, integrity, or availability
                          of our data.
                        is_default: false
                        name: Security Incident
                      id: 00000000-0000-0000-0000-000000000001
                      type: incident_types
              schema:
                $ref: '#/components/schemas/IncidentTypeResponse'
          description: CREATED
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - incident_settings_write
      summary: Create an incident type
      tags:
      - Incidents
      x-codegen-request-body-name: body
      x-permission:
        operator: AND
        permissions:
        - incident_settings_write
      x-unstable: '**Note**: This endpoint is in public beta.

        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).'
  /api/v2/incidents/config/types/{incident_type_id}:
    delete:
      description: Delete an incident type.
      operationId: DeleteIncidentType
      parameters:
      - $ref: '#/components/parameters/IncidentTypeIDPathParameter'
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - incident_settings_write
      summary: Delete an incident type
      tags:
      - Incidents
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - incident_settings_write
      x-unstable: '**Note**: This endpoint is in public beta.

        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).'
    get:
      description: Get incident type details.
      operationId: GetIncidentType
      parameters:
      - $ref: '#/components/parameters/IncidentTypeIDPathParameter'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        description: Any incidents that harm the confidentiality, integrity, or availability
                          of our data.
                        is_default: false
                        name: Security Incident
                      id: 00000000-0000-0000-0000-000000000003
                      type: incident_types
              schema:
                $ref: '#/components/schemas/IncidentTypeResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - incident_read
      summary: Get incident type details
      tags:
      - Incidents
      x-permission:
        operator: OR
        permissions:
        - incident_read
      x-unstable: '**Note**: This endpoint is in public beta.

        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).'
      x-datadog-tf-generator:
        artifact_kind: resource
        artifact_name: incident_type
        tf_description: Provides a Datadog incident type resource.
        group:
          read: GetIncidentType
          create: CreateIncidentType
          update: UpdateIncidentType
          delete: DeleteIncidentType
    patch:
      description: Update an incident type.
      operationId: UpdateIncidentType
      parameters:
      - $ref: '#/components/parameters/IncidentTypeIDPathParameter'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      createdBy: 00000000-0000-0000-0000-000000000000
                      description: 'Any incidents that harm (or have the potential to) the confidentiality,
                        integrity, or availability of our data. Note: This will notify the security team.'
                      is_default: false
                      lastModifiedBy: 00000000-0000-0000-0000-000000000000
                      name: Security Incident
                      prefix: IR
                    id: 00000000-0000-0000-0000-000000000000
                    type: incident_types
            schema:
              $ref: '#/components/schemas/IncidentTypePatchRequest'
        description: Incident type payload.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        description: Any incidents that harm the confidentiality, integrity, or availability
                          of our data.
                        is_default: false
                        name: Security Incident
                      id: 00000000-0000-0000-0000-000000000004
                      type: incident_types
              schema:
                $ref: '#/components/schemas/IncidentTypeResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - incident_settings_write
      summary: Update an incident type
      tags:
      - Incidents
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - incident_settings_write
      x-unstable: '**Note**: This endpoint is in public beta.

        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).'
components:
  parameters:
    IncidentTypeIDPathParameter:
      description: The UUID of the incident type.
      in: path
      name: incident_type_id
      required: true
      schema:
        type: string
  responses:
    BadRequestResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Bad Request
    ForbiddenResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Forbidden
    NotFoundResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Not Found
    TooManyRequestsResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Too many requests
    UnauthorizedResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Unauthorized
  schemas:
    APIErrorResponse:
      description: API error response.
      properties:
        errors:
          description: A list of errors.
          example:
          - Bad Request
          items:
            description: A list of items.
            example: Bad Request
            type: string
          type: array
      required:
      - errors
      type: object
    GoogleMeetConfigurationReference:
      description: A reference to a Google Meet Configuration resource.
      nullable: true
      properties:
        data:
          $ref: '#/components/schemas/GoogleMeetConfigurationReferenceData'
      required:
      - data
      type: object
    GoogleMeetConfigurationReferenceData:
      description: The Google Meet configuration relationship data object.
      nullable: true
      properties:
        id:
          description: The unique identifier of the Google Meet configuration.
          example: 00000000-0000-0000-0000-000000000000
          type: string
        type:
          description: The type of the Google Meet configuration.
          example: google_meet_configurations
          type: string
      required:
      - id
      - type
      type: object
    IncidentTypeAttributes:
      description: Incident type's attributes.
      properties:
        configuration:
          $ref: '#/components/schemas/IncidentTypeConfiguration'
          readOnly: true
        createdAt:
          description: Timestamp when the incident type was created.
          format: date-time
          readOnly: true
          type: string
        createdBy:
          description: A unique identifier that represents the user that created the incident type.
          example: 00000000-0000-0000-0000-000000000000
          readOnly: true
          type: string
        description:
          description: Text that describes the incident type.
          example: Any incidents that harm (or have the potential to) the confidentiality, integrity,
            or availability of our data.
          type: string
        is_default:
          default: false
          description: If true, this incident type will be used as the default incident type if a type
            is not specified during the creation of incident resources.
          example: false
          type: boolean
        lastModifiedBy:
          description: A unique identifier that represents the user that last modified the incident type.
          example: 00000000-0000-0000-0000-000000000000
          readOnly: true
          type: string
        modifiedAt:
          description: Timestamp when the incident type was last modified.
          format: date-time
          readOnly: true
          type: string
        name:
          description: The name of the incident type.
          example: Security Incident
          type: string
        prefix:
          description: The string that will be prepended to the incident title across the Datadog app.
          example: IR
          readOnly: true
          type: string
      required:
      - name
      type: object
    IncidentTypeConfiguration:
      description: The incident-type-scoped behavior settings. All fields are optional on update. Any
        field omitted from a PATCH request keeps its current value. This object is read-only on the incident
        type resource itself and is only mutated through the update (PATCH) endpoint.
      properties:
        allow_incident_deletion:
          default: false
          description: Whether incidents of this type can be deleted.
          example: false
          type: boolean
        allow_workflows:
          default: true
          description: Whether automation workflows can be triggered for incidents of this type.
          example: true
          type: boolean
        create_message:
          description: An optional message shown to users when they declare an incident of this type.
          example: Create an incident here
          type: string
        editable_timestamps:
          default: false
          description: Whether responders can edit incident timestamps for incidents of this type.
          example: false
          type: boolean
        private_incidents:
          default: false
          description: Whether responders can create private incidents of this type. This is an opt-in
            setting, distinct from `private_incidents_by_default`, which controls whether incidents are
            created private automatically.
          example: false
          type: boolean
        private_incidents_by_default:
          default: false
          description: Whether incidents of this type are created as private by default.
          example: false
          type: boolean
        slug_source:
          $ref: '#/components/schemas/IncidentTypeSlugSource'
        test_incidents:
          default: true
          description: Whether incidents of this type are treated as test incidents.
          example: true
          type: boolean
      type: object
    IncidentTypeCreateData:
      description: Incident type data for a create request.
      properties:
        attributes:
          $ref: '#/components/schemas/IncidentTypeAttributes'
        type:
          $ref: '#/components/schemas/IncidentTypeType'
      required:
      - type
      - attributes
      type: object
    IncidentTypeCreateRequest:
      description: Create request for an incident type.
      properties:
        data:
          $ref: '#/components/schemas/IncidentTypeCreateData'
      required:
      - data
      type: object
    IncidentTypeObject:
      description: Incident type response data.
      properties:
        attributes:
          $ref: '#/components/schemas/IncidentTypeAttributes'
        id:
          description: The incident type's ID.
          example: 00000000-0000-0000-0000-000000000000
          type: string
        relationships:
          $ref: '#/components/schemas/IncidentTypeRelationships'
        type:
          $ref: '#/components/schemas/IncidentTypeType'
      required:
      - id
      - type
      type: object
    IncidentTypePatchData:
      description: Incident type data for a patch request.
      properties:
        attributes:
          $ref: '#/components/schemas/IncidentTypeUpdateAttributes'
        id:
          description: The incident type's ID.
          example: 00000000-0000-0000-0000-000000000000
          type: string
        type:
          $ref: '#/components/schemas/IncidentTypeType'
      required:
      - id
      - type
      - attributes
      type: object
    IncidentTypePatchRequest:
      description: Patch request for an incident type.
      properties:
        data:
          $ref: '#/components/schemas/IncidentTypePatchData'
      required:
      - data
      type: object
    IncidentTypeRelationships:
      additionalProperties: {}
      description: The incident type's resource relationships.
      properties:
        created_by_user:
          $ref: '#/components/schemas/RelationshipToUser'
        google_meet_configuration:
          $ref: '#/components/schemas/GoogleMeetConfigurationReference'
        last_modified_by_user:
          $ref: '#/components/schemas/RelationshipToUser'
        microsoft_teams_configuration:
          $ref: '#/components/schemas/MicrosoftTeamsConfigurationReference'
        zoom_configuration:
          $ref: '#/components/schemas/ZoomConfigurationReference'
      type: object
    IncidentTypeResponse:
      description: Incident type response data.
      properties:
        data:
          $ref: '#/components/schemas/IncidentTypeObject'
      required:
      - data
      type: object
    IncidentTypeSlugSource:
      default: default
      description: When set to `servicenow`, incidents will display the ServiceNow record ID instead of
        the public ID. If no ServiceNow integration exists, the public ID will be displayed.
      enum:
      - default
      - servicenow
      example: default
      type: string
      x-enum-varnames:
      - DEFAULT
      - SERVICENOW
    IncidentTypeType:
      default: incident_types
      description: Incident type resource type.
      enum:
      - incident_types
      example: incident_types
      type: string
      x-enum-varnames:
      - INCIDENT_TYPES
    IncidentTypeUpdateAttributes:
      description: Incident type's attributes for updates.
      properties:
        configuration:
          $ref: '#/components/schemas/IncidentTypeConfiguration'
        createdAt:
          description: Timestamp when the incident type was created.
          format: date-time
          readOnly: true
          type: string
        createdBy:
          description: A unique identifier that represents the user that created the incident type.
          example: 00000000-0000-0000-0000-000000000000
          readOnly: true
          type: string
        description:
          description: Text that describes the incident type.
          example: 'Any incidents that harm (or have the potential to) the confidentiality, integrity,
            or availability of our data. Note: This will notify the security team.'
          type: string
        is_default:
          description: When true, this incident type will be used as the default type when an incident
            type is not specified.
          example: false
          type: boolean
        lastModifiedBy:
          description: A unique identifier that represents the user that last modified the incident type.
          example: 00000000-0000-0000-0000-000000000000
          readOnly: true
          type: string
        modifiedAt:
          description: Timestamp when the incident type was last modified.
          format: date-time
          readOnly: true
          type: string
        name:
          description: The name of the incident type.
          example: Security Incident
          type: string
        prefix:
          description: The string that will be prepended to the incident title across the Datadog app.
          example: IR
          readOnly: true
          type: string
      type: object
    MicrosoftTeamsConfigurationReference:
      description: A reference to a Microsoft Teams Configuration resource.
      nullable: true
      properties:
        data:
          $ref: '#/components/schemas/MicrosoftTeamsConfigurationReferenceData'
      required:
      - data
      type: object
    MicrosoftTeamsConfigurationReferenceData:
      description: The Microsoft Teams configuration relationship data object.
      nullable: true
      properties:
        id:
          description: The unique identifier of the Microsoft Teams configuration.
          example: 00000000-0000-0000-0000-000000000000
          type: string
        type:
          description: The type of the Microsoft Teams configuration.
          example: microsoft_teams_configurations
          type: string
      required:
      - id
      - type
      type: object
    RelationshipToUser:
      description: Relationship to user.
      properties:
        data:
          $ref: '#/components/schemas/RelationshipToUserData'
      required:
      - data
      type: object
    RelationshipToUserData:
      description: Relationship to user object.
      properties:
        id:
          description: A unique identifier that represents the user.
          example: 00000000-0000-0000-2345-000000000000
          type: string
        type:
          $ref: '#/components/schemas/UsersType'
      required:
      - id
      - type
      type: object
    UsersType:
      default: users
      description: Users resource type.
      enum:
      - users
      example: users
      type: string
      x-enum-varnames:
      - USERS
    ZoomConfigurationReference:
      description: A reference to a Zoom configuration resource.
      nullable: true
      properties:
        data:
          $ref: '#/components/schemas/ZoomConfigurationReferenceData'
      required:
      - data
      type: object
    ZoomConfigurationReferenceData:
      description: The Zoom configuration relationship data object.
      nullable: true
      properties:
        id:
          description: The unique identifier of the Zoom configuration.
          example: 00000000-0000-0000-0000-000000000000
          type: string
        type:
          description: The type of the Zoom configuration.
          example: zoom_configurations
          type: string
      required:
      - id
      - type
      type: object
  securitySchemes:
    AuthZ:
      description: This API uses OAuth 2 with the implicit grant flow.
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/v1/authorize
          scopes:
            incident_read: View incidents in Datadog.
            incident_settings_write: Configure Incident Settings.
          tokenUrl: /oauth2/v1/token
      type: oauth2
    apiKeyAuth:
      description: Your Datadog API Key.
      in: header
      name: DD-API-KEY
      type: apiKey
      x-env-name: DD_API_KEY
    appKeyAuth:
      description: Your Datadog APP Key.
      in: header
      name: DD-APPLICATION-KEY
      type: apiKey
      x-env-name: DD_APP_KEY
