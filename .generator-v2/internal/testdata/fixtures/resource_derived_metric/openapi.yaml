  "components": {
    "schemas": {
      "DerivedMetricCreateRequest": {
        "description": "Request body for creating or updating a derived metric.",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/DerivedMetricCreateData"
          }
        },
        "required": [
          "data"
        ],
        "type": "object"
      },
      "DerivedMetricCreateData": {
        "description": "Data object for creating or updating a derived metric.",
        "properties": {
          "attributes": {
            "$ref": "#/components/schemas/DerivedMetricAttributes"
          },
          "id": {
            "description": "The derived metric name used as the resource ID.",
            "example": "my.derived.metric",
            "type": "string"
          },
          "type": {
            "$ref": "#/components/schemas/DerivedMetricsType"
          }
        },
        "required": [
          "id",
          "type",
          "attributes"
        ],
        "type": "object"
      },
      "DerivedMetricAttributes": {
        "description": "Attributes of a derived metric.",
        "properties": {
          "definition": {
            "$ref": "#/components/schemas/DerivedMetricDefinition"
          }
        },
        "required": [
          "definition"
        ],
        "type": "object"
      },
      "DerivedMetricDefinition": {
        "description": "The definition of a derived metric as a formula over one or more queries.",
        "properties": {
          "formula": {
            "description": "The formula that combines the queries into the value of the derived metric.",
            "example": "a",
            "type": "string"
          },
          "queries": {
            "description": "The list of queries referenced by the formula.",
            "items": {
              "$ref": "#/components/schemas/DerivedMetricQuery"
            },
            "minItems": 1,
            "type": "array"
          }
        },
        "required": [
          "formula",
          "queries"
        ],
        "type": "object"
      },
      "DerivedMetricQuery": {
        "description": "A single query used in the definition of a derived metric.",
        "properties": {
          "data_source": {
            "description": "The data source that the query is run against.",
            "example": "metrics",
            "type": "string"
          },
          "name": {
            "description": "The name used to reference this query from the formula.",
            "example": "a",
            "type": "string"
          },
          "query": {
            "description": "The query string executed against the data source.",
            "example": "avg:system.cpu.user{*}",
            "type": "string"
          }
        },
        "required": [
          "data_source",
          "name",
          "query"
        ],
        "type": "object"
      },
      "DerivedMetricsType": {
        "default": "derived_metrics",
        "description": "The derived metric resource type.",
        "enum": [
          "derived_metrics"
        ],
        "example": "derived_metrics",
        "type": "string",
        "x-enum-varnames": [
          "DERIVED_METRICS"
        ]
      },
      "DerivedMetricResponse": {
        "description": "Response containing a single derived metric.",
        "properties": {
          "data": {
            "$ref": "#/components/schemas/DerivedMetricData"
          }
        },
        "readOnly": true,
        "required": [
          "data"
        ],
        "type": "object"
      },
      "DerivedMetricData": {
        "description": "A derived metric resource object.",
        "properties": {
          "attributes": {
            "$ref": "#/components/schemas/DerivedMetricAttributes"
          },
          "id": {
            "description": "The derived metric name used as the resource ID.",
            "example": "my.derived.metric",
            "type": "string"
          },
          "type": {
            "$ref": "#/components/schemas/DerivedMetricsType"
          }
        },
        "required": [
          "id",
          "type",
          "attributes"
        ],
        "type": "object"
      },
      "APIErrorResponse": {
        "description": "API error response.",
        "properties": {
          "errors": {
            "description": "A list of errors.",
            "example": [
              "Bad Request"
            ],
            "items": {
              "description": "A list of items.",
              "example": "Bad Request",
              "type": "string"
            },
            "type": "array"
          }
        },
        "required": [
          "errors"
        ],
        "type": "object"
      }
    },
    "responses": {
      "TooManyRequestsResponse": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/APIErrorResponse"
            }
          }
        },
        "description": "Too many requests"
      }
    },
    "parameters": {
      "MetricName": {
        "description": "The name of the metric.",
        "example": "dist.http.endpoint.request",
        "in": "path",
        "name": "metric_name",
        "required": true,
        "schema": {
          "type": "string"
        }
      }
