  "tags": [
    {
      "description": "The metrics endpoint allows you to:\n\n- Post metrics data so it can be graphed on Datadog\u2019s dashboards\n- Query metrics from any time period (timeseries and scalar)\n- Modify tag configurations for metrics\n- View tags and volumes for metrics\n\n**Note**: A graph can only contain a set number of points\nand as the timeframe over which a metric is viewed increases,\naggregation between points occurs to stay below that set number.\n\nThe Post, Patch, and Delete `manage_tags` API methods can only be performed by\na user who has the `Manage Tags for Metrics` permission.\n\nSee the [Metrics page](https://docs.datadoghq.com/metrics/) for more information.",
      "name": "Metrics",
      "x-datadog-tf-generator": {
        "derived_metric": {
          "resource": {
            "group": {
              "create": "CreateDerivedMetric",
              "delete": "DeleteDerivedMetric",
              "read": "GetDerivedMetric",
              "update": "UpdateDerivedMetric"
            },
            "tf_description": "Manages a derived metric computed from a formula and metric queries."
          }
        }
      }
    }
  ],
  "paths": {
    "/api/v2/metrics/derived-metrics": {
      "post": {
        "description": "Create a derived metric for the org. The metric name is supplied as the resource `id`,\nand the `definition` sets the formula and the queries the formula is computed from.\nRequires the `Manage Tags for Metrics` permission.",
        "operationId": "CreateDerivedMetric",
        "requestBody": {
          "content": {
            "application/json": {
              "examples": {
                "default": {
                  "value": {
                    "data": {
                      "attributes": {
                        "definition": {
                          "formula": "a",
                          "queries": [
                            {
                              "data_source": "metrics",
                              "name": "a",
                              "query": "avg:system.cpu.user{*}"
                            }
                          ]
                        }
                      },
                      "id": "my.derived.metric",
                      "type": "derived_metrics"
                    }
                  }
                }
              },
              "schema": {
                "$ref": "#/components/schemas/DerivedMetricCreateRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "content": {
              "application/json": {
                "examples": {
                  "default": {
                    "value": {
                      "data": {
                        "attributes": {
                          "definition": {
                            "formula": "a",
                            "queries": [
                              {
                                "data_source": "metrics",
                                "name": "a",
                                "query": "avg:system.cpu.user{*}"
                              }
                            ]
                          }
                        },
                        "id": "my.derived.metric",
                        "type": "derived_metrics"
                      }
                    }
                  }
                },
                "schema": {
                  "$ref": "#/components/schemas/DerivedMetricResponse"
                }
              }
            },
            "description": "Created",
            "headers": {
              "Location": {
                "description": "The URL of the newly created derived metric.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIErrorResponse"
                }
              }
            },
            "description": "Bad Request"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIErrorResponse"
                }
              }
            },
            "description": "Forbidden"
          },
          "409": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/APIErrorResponse"
                }
              }
            },
            "description": "Conflict"
          },
          "429": {
            "$ref": "#/components/responses/TooManyRequestsResponse"
          }
        },
        "security": [
          {
            "apiKeyAuth": [],
            "appKeyAuth": []
          },
          {
            "AuthZ": [
              "metric_tags_write"
            ]
          }
        ],
        "summary": "Create a derived metric",
        "tags": [
          "Metrics"
        ],
        "x-codegen-request-body-name": "body",
        "x-datadog-generators": {
          "generators": {
            "terraform": true
          }
        },
        "x-permission": {
          "operator": "OR",
          "permissions": [
            "metric_tags_write"
          ]
        }
      }
    },
    "/api/v2/metrics/derived-metrics/{metric_name}": {
