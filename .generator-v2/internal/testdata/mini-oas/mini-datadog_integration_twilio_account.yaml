        If you have any feedback, contact [Datadog support](https://docs.datadoghq.com/help/).'
      x-menu-order: 2
      x-undo:
        type: unsafe
        operationId: DeleteTwilioIntegrationAccount
        parameters:
        - name: account_id
          source: data.id
      x-codegen-request-body-name: body
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwilioIntegrationAccountCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwilioIntegrationAccountResponse'
              examples:
                default:
                  value:
                    data:
                      id: 953a0060-81ec-4221-aed4-d4733b59cd96
                      type: integration-account
                      attributes:
                        name: twilio-prod
                        authentication:
                          auth_type: basic
                          username: SKxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                        settings:
                          account_sid: ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                          censor_logs: true
                        dataflows:
                          twilio-messages-logs:
                            enabled: true
                            status:
