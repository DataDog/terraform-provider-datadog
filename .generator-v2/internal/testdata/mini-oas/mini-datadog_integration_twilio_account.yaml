        status:
          $ref: '#/components/schemas/IntegrationAccountDataflowStatus'
    TwilioEventsLogsIntegrationDataflowRequest:
      x-ignore-duplicate-object: true
      additionalProperties: false
      description: Twilio Event resource logs, which record virtually every action taken in your Twilio
