        status:
          $ref: '#/components/schemas/IntegrationAccountDataflowStatus'
    TwilioCallSummariesLogsIntegrationDataflowRequest:
      x-ignore-duplicate-object: true
      additionalProperties: false
      description: Twilio Call Summary resource logs, covering the metadata and performance of the calls
