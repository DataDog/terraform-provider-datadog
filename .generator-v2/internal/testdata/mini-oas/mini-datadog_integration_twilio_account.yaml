components:
  parameters:
    IntegrationAccountIdParameter:
      description: Unique identifier of the integration account.
      in: path
      name: account_id
      required: true
      schema:
        type: string
  responses:
    BadRequestResponse:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    ForbiddenResponse:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    NotFoundResponse:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    TooManyRequestsResponse:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    UnprocessableEntityResponse:
      description: The server cannot process the request because it contains invalid data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JSONAPIErrorResponse'
  schemas:
    APIErrorResponse:
      type: object
      description: API error response.
      required:
      - errors
      properties:
        errors:
          example:
          - Bad Request
          type: array
          description: A list of errors.
          items:
            type: string
            description: A list of items.
            example: Bad Request
    IntegrationAccountDataflowHealth:
      description: Collection health of a single dataflow.
      enum:
      - DATAFLOW_HEALTH_OK
      - DATAFLOW_HEALTH_BROKEN
      - DATAFLOW_HEALTH_UNKNOWN
      example: DATAFLOW_HEALTH_OK
      type: string
      x-enum-varnames:
      - OK
      - BROKEN
      - UNKNOWN
    IntegrationAccountDataflowStatus:
      description: Read-only collection status of a dataflow.
      properties:
        health:
          $ref: '#/components/schemas/IntegrationAccountDataflowHealth'
        message:
          description: Human-readable detail, populated when the dataflow is not healthy.
          example: ''
          type: string
        updated_at:
          description: Time the status was last computed.
          example: '2026-06-25T08:30:50Z'
          format: date-time
          type: string
      readOnly: true
      type: object
    IntegrationAccountType:
      description: The type of the integration account resource. Always `integration-account`.
      default: integration-account
      enum:
      - integration-account
      example: integration-account
      type: string
      x-enum-varnames:
      - INTEGRATION_ACCOUNT
    JSONAPIErrorItem:
      type: object
      description: API error response body
      properties:
        status:
          type: string
          description: Status code of the response.
          example: '400'
        title:
          type: string
          description: Short human-readable summary of the error.
          example: Bad Request
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the error.
          example: Missing required attribute in body
        meta:
          type: object
          description: Non-standard meta-information about the error
          additionalProperties: {}
        source:
          $ref: '#/components/schemas/JSONAPIErrorItemSource'
    JSONAPIErrorItemSource:
      type: object
      description: References to the source of the error.
      properties:
        pointer:
          type: string
          description: A JSON pointer to the value in the request document that caused the error.
          example: /data/attributes/title
        parameter:
          type: string
          description: A string indicating which URI query parameter caused the error.
          example: limit
        header:
          type: string
          description: A string indicating the name of a single request header which caused the error.
          example: Authorization
    JSONAPIErrorResponse:
      type: object
      description: API error response.
      required:
      - errors
      properties:
        errors:
          type: array
          description: A list of errors.
          items:
            $ref: '#/components/schemas/JSONAPIErrorItem'
    TwilioAlertsLogsIntegrationDataflowRequest:
      x-ignore-duplicate-object: true
      additionalProperties: false
      description: Twilio Alert resource logs, which detail the errors and warnings raised when Twilio
        makes a webhook request to your server or when your application calls the Twilio REST API. This
        is the one kind of data the integration collects by default.
      type: object
      properties:
        enabled:
          description: Whether Datadog collects this data. Defaults to `true`; set to `false` to stop
            collection.
          example: true
          type: boolean
    TwilioAlertsLogsIntegrationDataflowResponse:
      x-ignore-duplicate-object: true
      description: Twilio Alert resource logs, which detail the errors and warnings raised when Twilio
