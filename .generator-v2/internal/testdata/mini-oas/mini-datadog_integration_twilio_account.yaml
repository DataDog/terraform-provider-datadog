    TooManyRequestsResponse:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
    UnprocessableEntityResponse:
      description: The server cannot process the request because it contains invalid data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JSONAPIErrorResponse'
  schemas:
    APIErrorResponse:
      type: object
      description: API error response.
      required:
      - errors
      properties:
        errors:
          example:
          - Bad Request
          type: array
          description: A list of errors.
          items:
            type: string
            description: A list of items.
            example: Bad Request
    IntegrationAccountBasicAuthRequest:
      description: Username and password authentication.
      type: object
      required:
      - auth_type
      - username
      - password
      properties:
        auth_type:
          $ref: '#/components/schemas/IntegrationAccountBasicAuthType'
        username:
          description: Non-secret username or public identifier for the credential pair.
          example: datadog
          type: string
        password:
          description: Secret password or private key.
          example: your-password
          type: string
          writeOnly: true
          x-secret: true
    IntegrationAccountBasicAuthResponse:
      description: The basic authentication method and username configured on the account.
      type: object
      required:
      - auth_type
      - username
      properties:
        auth_type:
          $ref: '#/components/schemas/IntegrationAccountBasicAuthType'
        username:
          description: Non-secret username or public identifier for the credential pair.
          example: datadog
          type: string
    IntegrationAccountBasicAuthType:
      description: The authentication method type.
      default: basic
      enum:
      - basic
      example: basic
      type: string
      x-enum-varnames:
      - BASIC
    IntegrationAccountBasicAuthUpdate:
      description: Username and password authentication. Only the fields provided are changed; omit `password`
        to keep the stored one.
      type: object
      required:
      - auth_type
      properties:
        auth_type:
          $ref: '#/components/schemas/IntegrationAccountBasicAuthType'
        username:
          description: Non-secret username or public identifier for the credential pair.
          example: datadog
          type: string
        password:
          description: Secret password or private key.
          example: your-password
          type: string
          writeOnly: true
          x-secret: true
    IntegrationAccountDataflowHealth:
      description: Collection health of a single dataflow.
      enum:
      - DATAFLOW_HEALTH_OK
      - DATAFLOW_HEALTH_BROKEN
      - DATAFLOW_HEALTH_UNKNOWN
      example: DATAFLOW_HEALTH_OK
      type: string
      x-enum-varnames:
      - OK
      - BROKEN
      - UNKNOWN
    IntegrationAccountDataflowStatus:
      description: Read-only collection status of a dataflow.
      properties:
        health:
