name: Check Generated Files

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - master
      - v3
  # Emit the existing skipped result on merge-queue pushes so requiring this
  # check does not leave queued commits waiting for a missing check.
  push:
    branches:
      - mq-working-branch-master-**
      - mq-working-branch-v3-**

concurrency:
  group: generated-files-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Generated files must only be produced by tfgen, never hand-edited.
  # Preserve the existing bot, generate/*, and retire/* exemptions.
  # The force-regeneration label permits intentional regenerated output.
  # Keep this job ID stable: this check must be required independently.
  no-generated-file-edits:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.type != 'Bot' &&
      !startsWith(github.head_ref, 'generate/') &&
      !startsWith(github.head_ref, 'retire/') &&
      !contains(github.event.pull_request.labels.*.name, 'force-regeneration')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail if a generated file was hand-edited
        run: |
          files=$(git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          generated=""
          for f in $files; do
            # testdata/snapshots fixtures (e.g. generator golden files) and
            # generator templates (*.go.tmpl) intentionally contain this
            # header as fixture/template content; they aren't tfgen output.
            case "$f" in
              */testdata/*|*/snapshots/*|*.go.tmpl) continue ;;
            esac
            # Match tfgen's exact header rather than the generic Go "Code
            # generated ... DO NOT EDIT." pattern, so this check doesn't flag
            # files generated by unrelated tools.
            if grep -qE '^// Code generated by tfgen; DO NOT EDIT\.$' "$f" 2>/dev/null; then
              generated="$generated$f"$'\n'
            fi
          done
          if [ -n "$generated" ]; then
            echo "::error::The following generated files were edited by hand. They are produced by tfgen and must not be edited directly - update the OpenAPI spec or generator instead:"
            echo "$generated"
            echo "For intentional regeneration after generator changes, add the force-regeneration PR label. Adding or removing it automatically reevaluates this check. This label does not run the generator."
            exit 1
          fi
          echo "No generated files were edited."
