name: Run Integration Tests

permissions:
  contents: read

# Fork pull_request runs get no OIDC token, so the full suite runs only for
# same-repo PRs. Fork PRs get affected tests from PR Test Selection -> PR Integration Tests.
on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: ${{ github.head_ref || github.run_id }}-test-integration
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.13.1"

jobs:
  integration_tests:
    runs-on: ubuntu-latest
    # full_name and not head.repo.fork: head.repo is null for a deleted fork,
    # and the expression null == false evaluates to true.
    if: >-
      (github.event_name == 'pull_request'
      && contains(github.event.pull_request.labels.*.name, 'ci/integrations')
      && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'schedule'
    permissions:
      contents: read
      id-token: write # Required to mint Datadog credentials via dd-sts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@7d2d231c02fd54a3da912e582ff87cb995d1fd30 # v1.0.4
        with:
          policy: terraform-provider-datadog
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install terraform
        run: |
          set -euo pipefail
          VERSION="${{ env.TERRAFORM_VERSION }}"
          ZIP="terraform_${VERSION}_linux_amd64.zip"
          mkdir -p ~/.cache/terraform
          cd ~/.cache/terraform
          wget -q "https://releases.hashicorp.com/terraform/${VERSION}/${ZIP}" -O "${ZIP}"
          wget -q "https://releases.hashicorp.com/terraform/${VERSION}/terraform_${VERSION}_SHA256SUMS" -O SHA256SUMS
          grep "  ${ZIP}\$" SHA256SUMS | sha256sum -c -
          unzip -o "${ZIP}"
      - name: Sweep stale test resources
        run: make sweep
        env:
          DD_TEST_CLIENT_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_TEST_CLIENT_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
      - name: Build skip list for flaky tests
        id: skip-list
        run: |
          SKIP_REGEX=$(python3 scripts/build_skip_regex.py --escape-for-make)
          if [ -n "$SKIP_REGEX" ]; then
            echo "test_args=-skip '${SKIP_REGEX}'" >> "$GITHUB_OUTPUT"
            echo "Skipping flaky tests: ${SKIP_REGEX}"
          else
            echo "test_args=" >> "$GITHUB_OUTPUT"
          fi
      - name: Run integration tests
        run: make testacc
        env:
          RECORD: "none"
          CI: "true"
          DD_TEST_CLIENT_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_TEST_CLIENT_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          DD_HTTP_CLIENT_RETRY_ENABLED: "true"
          DD_HTTP_CLIENT_RETRY_JITTER: "2"
          TF_ACC_TERRAFORM_PATH: "/home/runner/.cache/terraform/terraform"
          TF_ACC_TEMP_DIR: "/tmp"
          TESTARGS: ${{ steps.skip-list.outputs.test_args }}
