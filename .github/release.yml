changelog:
  exclude:
    labels:
      - changelog/no-changelog
  categories:
    - title: BUGFIXES
      labels:
        - changelog/bugfix
    - title: IMPROVEMENTS
      labels:
        - changelog/improvement
    - title: FEATURES
      labels:
        - changelog/feature
        - changelog/added
        - changelog/Added
    - title: NOTES
      labels:
        - changelog/note
